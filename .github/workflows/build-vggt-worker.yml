name: Build VGGT RunPod Worker

on:
  push:
    branches: [main]
    paths:
      - 'RunPodWorker/handler_vggt.py'
      - 'RunPodWorker/Dockerfile.vggt'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: hupheagency/hupheai/vggt-worker

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./RunPodWorker
          file: ./RunPodWorker/Dockerfile.vggt
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # VGGT image is groot (~8 GB) — cache bespaart 20-30 min na eerste run
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
